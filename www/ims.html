<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMS / VoLTE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f6fa;color:#222;padding:16px;max-width:420px;margin:0 auto}
h2{font-size:17px;font-weight:600;margin-bottom:4px}
.sub{font-size:12px;color:#888;margin-bottom:14px}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f1f5}
.row:last-child{border:0}
.lbl{font-size:13px;color:#555}
.val{font-size:13px;font-weight:500;color:#222}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:#c0c4cc}
.dot.ok{background:#34a853}.dot.err{background:#ea4335}.dot.idle{background:#fbbc05}
.stat{font-size:12px;color:#888;margin-top:8px;text-align:center}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:9px 0;border:0;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:#eee;color:#333}
.btn.pri{background:#1a73e8;color:#fff}.btn.warn{background:#ea4335;color:#fff}
#reg{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;white-space:pre-wrap}
</style></head>
<body>
<h2>IMS / VoLTE</h2>
<div class="sub">外挂守护 simadmin-ims · 端口 3001</div>
<div class="panel">
<div class="row"><span class="lbl">守护进程</span><span class="val"><span class="dot" id="dd"></span><span id="ddt">—</span></span></div>
<div class="row"><span class="lbl">IMS 注册</span><span class="val"><span class="dot" id="rd"></span><span id="r">—</span></span></div>
<div class="row"><span class="lbl">接口 / IP</span><span class="val" id="ip">—</span></div>
<div class="row"><span class="lbl">P-CSCF</span><span class="val" id="pc">—</span></div>
<div class="row"><span class="lbl">IMS 域</span><span class="val" id="dom">—</span></div>
<div class="row"><span class="lbl">版本</span><span class="val" id="ver">—</span></div>
</div>
<div class="panel">
<div class="btns">
<button class="btn" onclick="refresh()">刷新</button>
<button class="btn pri" onclick="doReg()">注册 IMS</button>
<button class="btn warn" onclick="doUnreg()">注销</button>
</div>
<div class="stat">日志:</div>
<pre id="reg">加载中...</pre>
</div>
<script src="/ims.js"></script></body></html>
