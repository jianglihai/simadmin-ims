name: build
on:
  push:
    paths: ["Cargo.toml", "src/**", ".github/workflows/**"]
  workflow_dispatch:
jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross g++-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      - name: Build
        env:
          CC_aarch64-unknown-linux-gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: simadmin-ims
          path: target/aarch64-unknown-linux-gnu/release/simadmin-ims
          if-no-files-found: error
